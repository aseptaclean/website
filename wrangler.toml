# Cloudflare Pages project configuration. Astro remains a plain static build
# (no adapter — see docs/05-DECISIONS-LOG.md); this file exists solely to run
# functions/api/lead.ts as a Cloudflare Pages Function against real bindings,
# both locally (`wrangler pages dev`) and in the deployed project.
name = "aseptaclean"
pages_build_output_dir = "./dist"
compatibility_date = "2026-08-01"

# Private object storage for lead submissions and uploaded property media.
# Matches LEAD_UPLOADS in functions/_lib/lead.ts's LeadEnvironment.
# Create the real bucket with: wrangler r2 bucket create aseptaclean-lead-uploads
[[r2_buckets]]
binding = "LEAD_UPLOADS"
bucket_name = "aseptaclean-lead-uploads"

# Submission rate limiting (5 attempts / 15 minutes per hashed IP). Optional
# in code (LEAD_RATE_LIMIT?), but wired here so the limit is actually enforced.
# Create the real namespace with: wrangler kv namespace create LEAD_RATE_LIMIT
[[kv_namespaces]]
binding = "LEAD_RATE_LIMIT"
id = "5e5faee201c34b36b76ecda6de34927f"

# All other LeadEnvironment fields (TURNSTILE_SECRET_KEY, HUBSPOT_*,
# RESEND_API_KEY, EMAIL_FROM_ADDRESS, OWNER_ALERT_EMAIL, TWILIO_*,
# LEAD_ALERT_PHONE, ALLOWED_ORIGINS) are secrets, not config, and are
# intentionally not set here. Production: `wrangler pages secret put <NAME>`.
# Local dev: create a git-ignored .dev.vars file (see .dev.vars.example).

# Build-time environment variables. These MUST live here, not in the Cloudflare dashboard.
#
# Why: this file sets `pages_build_output_dir`, which makes it the source of truth for Pages
# configuration — Cloudflare's docs state you "cannot edit the same fields in the dashboard once
# you are using this file." Every build before 2026-08-17 logged `Build environment variables:
# (none found)` and then failed `npm run validate:env`, so five consecutive commits never
# deployed and the live site silently served a stale build. Dashboard/API values are ignored.
#
# Only PUBLIC_* values belong here. Every one is compiled into the shipped HTML already, so
# committing them exposes nothing that visiting the site would not. Real secrets
# (TURNSTILE_SECRET_KEY, HUBSPOT_*, RESEND_API_KEY, EMAIL_FROM_ADDRESS, OWNER_ALERT_EMAIL,
# TWILIO_*) are Cloudflare Pages Secrets and MUST NEVER be added to this file.
#
# Keep in sync with .env.production, which stays gitignored and drives local builds.
[vars]
PUBLIC_ASSESSMENT_FEE = "195"
PUBLIC_BUSINESS_HOURS = "Monday–Saturday, 7:00 AM–7:00 PM Pacific Time; closed Sunday"
PUBLIC_BUSINESS_NAME = "Aseptaclean"
PUBLIC_DEPLOYMENT_ENV = "production"
PUBLIC_EMAIL = "info@aseptaclean.com"
PUBLIC_FORM_ENABLED = "true"
PUBLIC_FORM_ENDPOINT = "/api/lead"
PUBLIC_FOUNDER_NAME = "Matthew Ruiz"
# Google Tag Manager container. Public configuration by definition — it is compiled into every
# shipped page and is readable by anyone who views source. It belongs here rather than in the
# dashboard for the same reason as every other value in this block: this file sets
# `pages_build_output_dir`, so Cloudflare ignores dashboard build variables entirely.
#
# THIS IS THE ONLY BASE TAG ON THE SITE. PUBLIC_GA_ID stays unset ON PURPOSE — GA4 G-40K4ETN1NX
# is configured as a tag INSIDE this container, not as a second base installation.
# src/components/AnalyticsHead.astro renders the standalone gtag.js loader only when
# `gaId && !gtmId`, so setting both would silence the gtag branch rather than duplicate it — but
# do not set both. One base tag, one `page_view`.
PUBLIC_GTM_ID = "GTM-WSSQ62BN"
# Google Ads is added as a destination on the existing Google tag. AnalyticsHead queues this
# config command through the same dataLayer and does NOT install another gtag.js or GTM loader.
# It is separately held behind Termly's Advertising category. This is a public tag identifier,
# not a secret. No native Ads conversion event is published until Google Ads supplies the real
# conversion label; never invent the value after the slash in AW-18340008320/<label>.
PUBLIC_GOOGLE_ADS_ID = "AW-18340008320"
# PUBLIC_INSURANCE_STATUS intentionally absent. doc 21 §2.5 / AGENTS.md §3: no current COI is
# verified in this repository, so the insurance line and the "Organic Pathogen Endorsed" line
# (both gated on this same value — see src/data/site.ts, CredentialBar.astro, about/index.astro,
# faq/index.astro) must be suppressed rather than published. This was previously set to the
# recorded-but-unverified wording, which shipped the claim on every production build regardless
# of the suppression logic in src/. Set it here (matching the recorded wording in doc 21 §2.5
# exactly, so nothing needs to change downstream) only after the owner or insurance broker
# verifies it against a current Certificate of Insurance.
PUBLIC_LEGAL_NAME = "Aseptaclean, LLC"
PUBLIC_PHONE = "(408) 785-7588"
PUBLIC_PRIVACY_CONTACT = "info@aseptaclean.com"
PUBLIC_RESPONSE_TIME = "within one business day"
PUBLIC_SERVICE_AREA = "South Bay & Peninsula"
PUBLIC_SITE_URL = "https://aseptaclean.com"
PUBLIC_SMS_NUMBER = "(408) 785-7588"
PUBLIC_TERMLY_CONSENT_ENABLED = "true"
PUBLIC_TERMLY_COOKIE_POLICY_ID = "02262c90-99a5-446e-9bff-b0beb7b3d24a"
PUBLIC_TERMLY_PRIVACY_POLICY_ID = "1f1dee92-08da-4cde-9c53-e7798ab17692"
PUBLIC_TERMLY_TERMS_POLICY_ID = "5502eb89-1cb1-43ce-ae8a-b589abee0466"
PUBLIC_TERMLY_WEBSITE_UUID = "f074d6a3-6dc0-47ff-a10c-b27c7922b1c7"
PUBLIC_TSWMP_STATUS = "pending"
